name: Docker Develop Backend PRD

on:
  push:
    branches:
      - main-old
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-pack:
    name: Build & Pack Image
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          service_account: githubactions@careful-acumen-422922-k4.iam.gserviceaccount.com
          workload_identity_provider: projects/401654669410/locations/global/workloadIdentityPools/github-pool/providers/hi-luca-repo

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Obtener último release
        id: obtener_release
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.TOKEN_USER_GITHUB }}" \
            "https://api.github.com/repos/${{ secrets.REPO_OWNER }}/${{ secrets.REPO_NAME }}/releases/latest" \
            | jq -r '.tag_name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sinergia
          push: true
          tags: us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:prd

  deploy:
    name: Download & Deploy
    runs-on: ubuntu-latest
    needs: build-and-pack
    environment: main

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - id: auth-deploy
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          service_account: githubactions@careful-acumen-422922-k4.iam.gserviceaccount.com
          workload_identity_provider: projects/401654669410/locations/global/workloadIdentityPools/github-pool/providers/hi-luca-repo

      - name: Configure Docker for GCR 
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Pull Docker image
        run: |
          docker pull us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:prd

      - name: Save image to tar
        run: |
          docker save -o backend.tar us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:prd

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar tar al servidor
        run: scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa backend.tar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/ramon/prod/temp/

      - name: Desplegar en servidor
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ramon/prod/docker-deploy
            docker load -i /home/ramon/prod/temp/backend.tar
            docker compose up -d
            docker system prune -af
            rm -f /home/ramon/prod/temp/backend.tar
            echo "Despliegue realizado exitosamente."

      - name: Finalizar
        run: echo "Despliegue completado."


