# nginx/nginx.conf
# ══════════════════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy para HiLuca LBU
# El Load Balancer de GCP termina SSL y habla HTTP:80 con esta instancia.
# ══════════════════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging – propaga la IP real del cliente (el LB pone X-Forwarded-For)
    log_format main '$http_x_forwarded_for - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Tamaño máximo de body (útil para uploads de Strapi)
    client_max_body_size 100m;

    # Comprimir respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream definitions ──────────────────────────────────────────────
    upstream strapi_backend {
        server strapi:1337 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    upstream sinergia_backend {
        server sinergia:60000 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    upstream fury_backend {
        server fury:8000 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    upstream qdrant_backend {
        server qdrant:6333;
        keepalive 32;
    }

    upstream langfuse_backend {
        server langfuse-web:3000 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    upstream minio_backend {
        server minio:9090 max_fails=10 fail_timeout=30s;
        keepalive 32;
    }

    # upstream guide_backend {
    #     server luca-guide:8000 max_fails=10 fail_timeout=30s;
    #     keepalive 32;
    # }

    # ── Servidor principal ────────────────────────────────────────────────
    # ── Catch-all / Health Check ──────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Rechazar cualquier otra petición que no coincida con un subdominio válido
        location / {
            return 404;
        }
    }

    # ── Sinergia – API FastAPI ────────────────────────────────────────────
    server {
        listen 80;
        server_name api.hiluca.com api-dev.hiluca.com api-qas.hiluca.com sec.hiluca.com;

        location / {
            proxy_pass http://sinergia_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }
    }

    # ── Strapi – CMS y API ────────────────────────────────────────────────
    server {
        listen 80;
        server_name strapi.hiluca.com strapi-dev.hiluca.com strapi-qas.hiluca.com;

        location / {
            proxy_pass http://strapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }
    }

    # ── N8N – Automatización ──────────────────────────────────────────────
    server {
        listen 80;
        server_name n8n.hiluca.com n8n-dev.hiluca.com n8n-qas.hiluca.com;

        location / {
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ── Fury – AI Backend ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name fury.hiluca.com fury-dev.hiluca.com fury-qas.hiluca.com;

        location / {
            proxy_pass http://fury_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    # ── Qdrant – Vector DB Dashboard ──────────────────────────────────────
    server {
        listen 80;
        server_name qdrant.hiluca.com qdrant-dev.hiluca.com qdrant-qas.hiluca.com;

        location / {
            proxy_pass http://qdrant_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Langfuse ────────────────────────────────────────────────
    server {
        listen 80;
        server_name langfuse.hiluca.com langfuse-dev.hiluca.com langfuse-qas.hiluca.com;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Minio ────────────────────────────────────────────────
    server {
        listen 80;
        server_name minio.hiluca.com minio-dev.hiluca.com minio-qas.hiluca.com;

        location / {
            proxy_pass http://minio_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # ── Guide – API FastAPI ────────────────────────────────────────────
    server {
        listen 80;
        server_name guide.hiluca.com guide-dev.hiluca.com guide-qas.hiluca.com;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $backend_service "luca-guide:8000";
            proxy_pass http://$backend_service;
            # proxy_pass http://guide_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }
    }
}
