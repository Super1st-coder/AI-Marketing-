  deploy:
    name: Download & Deploy
    runs-on: ubuntu-latest
    needs: [build-and-pack]
    environment: develop

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - id: auth-deploy
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          service_account: githubactions@careful-acumen-422922-k4.iam.gserviceaccount.com
          workload_identity_provider: projects/401654669410/locations/global/workloadIdentityPools/github-pool/providers/hi-luca-repo

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Pull Docker image
        run: |
          docker pull us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-frontend-image:develop

      - name: Save image to tar
        run: |
          docker save -o frontend.tar us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-frontend-image:develop

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar tar al servidor
        run: scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa frontend.tar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/mnt/disks/hiluca-data/temp/

      - name: Desplegar en servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ramon/hiluca-frontend-v2
            docker load -i /mnt/disks/hiluca-data/temp/frontend.tar
            docker compose up -d
            rm -f /mnt/disks/hiluca-data/temp/frontend.tar
            echo "Despliegue realizado exitosamente."

      - name: Finalizar
        run: echo "Despliegue completado."
