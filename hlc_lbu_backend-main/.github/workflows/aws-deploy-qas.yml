name: AWS Deploy Backend QAS

on:
  push:
    branches:
      - aws-qas
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

env:
  AWS_REGION: "us-east-2"
  ROLE_TO_ASSUME: "arn:aws:iam::861276093436:role/hiluca-lbu-qas-github-actions-role"
  S3_DEPLOY_BUCKET: "hiluca-lbu-qas-deploy-861276093436"
  ECR_REGISTRY: "861276093436.dkr.ecr.us-east-2.amazonaws.com"
  SECRET_NAME: "hiluca-lbu-qas-env"

jobs:
  build-and-pack:
    name: Build & Pack Images (AWS)
    runs-on: ubuntu-latest
    environment: qas
    outputs:
      sinergia_changed: ${{ steps.check_sinergia.outputs.changed }}
      fury_changed: ${{ steps.check_fury.outputs.changed }}
      strapi_changed: ${{ steps.check_strapi.outputs.changed }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # ── AWS Auth & ECR Login ───────────────────────────────
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Hash Sinergia ──────────────────────────────────────
      - name: Calcular hash Sinergia
        id: hash_sinergia
        run: |
          HASH=$(find ./sinergia -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache Sinergia
        id: cache_sinergia
        uses: actions/cache@v4
        with:
          path: .cache/sinergia_hash_aws
          key: sinergia-hash-aws-${{ steps.hash_sinergia.outputs.hash }}

      - name: Verificar Sinergia
        id: check_sinergia
        run: |
          if [ "${{ steps.cache_sinergia.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Sinergia sin cambios."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Sinergia cambió."
          fi

      # ── Hash Fury ──────────────────────────────────────────
      - name: Calcular hash Fury
        id: hash_fury
        run: |
          HASH=$(find ./fury/app -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache Fury
        id: cache_fury
        uses: actions/cache@v4
        with:
          path: .cache/fury_hash_aws
          key: fury-hash-aws-${{ steps.hash_fury.outputs.hash }}

      - name: Verificar Fury
        id: check_fury
        run: |
          if [ "${{ steps.cache_fury.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Fury sin cambios."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Fury cambió."
          fi

      # ── Hash Strapi ────────────────────────────────────────
      - name: Calcular hash Strapi
        id: hash_strapi
        run: |
          HASH=$(find ./strapi-n8n/src ./strapi-n8n/config ./strapi-n8n/Dockerfile ./strapi-n8n/package.json -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache Strapi
        id: cache_strapi
        uses: actions/cache@v4
        with:
          path: .cache/strapi_hash_aws
          key: strapi-hash-aws-${{ steps.hash_strapi.outputs.hash }}

      - name: Verificar Strapi
        id: check_strapi
        run: |
          if [ "${{ steps.cache_strapi.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Strapi sin cambios."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Strapi cambió."
          fi

      # ── Build Sinergia ─────────────────────────────────────
      - name: Build & push Sinergia Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sinergia
          push: true
          tags: ${{ env.ECR_REGISTRY }}/lbr-backend-image:qas,${{ env.ECR_REGISTRY }}/lbr-backend-image:latest
          platforms: linux/amd64

      - name: Guardar hash Sinergia
        if: steps.check_sinergia.outputs.changed == 'true'
        run: mkdir -p .cache && echo "${{ steps.hash_sinergia.outputs.hash }}" > .cache/sinergia_hash_aws

      # ── Build Fury ─────────────────────────────────────────
      - name: Build & push Fury Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./fury/app
          push: true
          tags: ${{ env.ECR_REGISTRY }}/fury-backend-image:qas,${{ env.ECR_REGISTRY }}/fury-backend-image:latest
          platforms: linux/amd64

      - name: Guardar hash Fury
        if: steps.check_fury.outputs.changed == 'true'
        run: mkdir -p .cache && echo "${{ steps.hash_fury.outputs.hash }}" > .cache/fury_hash_aws

      # ── Build Strapi ───────────────────────────────────────
      - name: Build & push Strapi Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./strapi-n8n
          push: true
          tags: ${{ env.ECR_REGISTRY }}/strapi:qas,${{ env.ECR_REGISTRY }}/strapi:latest
          platforms: linux/amd64

      - name: Guardar hash Strapi
        if: steps.check_strapi.outputs.changed == 'true'
        run: mkdir -p .cache && echo "${{ steps.hash_strapi.outputs.hash }}" > .cache/strapi_hash_aws

      - name: Generar deploy.sh y empaquetar artefactos
        run: |
          # Generamos el script en el runner (sin comillas problemáticas para SSM)
          # Las variables de GitHub Actions se interpolan AQUI, no en la EC2
          cat > deploy.sh << 'DEPLOY_EOF'
          #!/bin/bash
          set -e

          APP_DIR=/app/hiluca-lbu
          AWS_REGION=us-east-2
          ECR_REGISTRY=861276093436.dkr.ecr.us-east-2.amazonaws.com
          SECRET_NAME=hiluca-lbu-qas-env

          echo "==> [1/5] Descargando .env desde AWS Secrets Manager..."
          aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text > "$APP_DIR/.env"

          echo "==> [2/5] Inyectando variables de infraestructura..."
          grep -q "^DATABASE_HOST=" "$APP_DIR/.env" || echo "DATABASE_HOST=hiluca-lbu-qas-postgres.cf6mg0eu2jo2.us-east-2.rds.amazonaws.com" >> "$APP_DIR/.env"
          grep -q "^DATABASE_PORT=" "$APP_DIR/.env" || echo "DATABASE_PORT=5432" >> "$APP_DIR/.env"
          grep -q "^ECR_REGISTRY=" "$APP_DIR/.env" || echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$APP_DIR/.env"

          echo "==> [3/5] Autenticando con ECR..."
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "==> [4/5] Levantando contenedores..."
          cd "$APP_DIR"
          docker compose -f docker-compose.aws.yaml pull -q
          docker compose -f docker-compose.aws.yaml up -d --remove-orphans
          
          echo "==> Reiniciando Nginx para refrescar DNS de upstreams..."
          docker restart hiluca-nginx

          echo "==> [5/5] Limpiando imagenes antiguas..."
          docker image prune -af

          echo ""
          echo "Estado de contenedores:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          # Print logs for any unhealthy container
          UNHEALTHY=$(docker ps --filter "health=unhealthy" --format "{{.Names}}")
          if [ ! -z "$UNHEALTHY" ]; then
            echo "====================================="
            echo " WARNING: Se detectaron contenedores unhealthy:"
            for c in $UNHEALTHY; do
              echo "--- Logs de $c ---"
              docker logs --tail 100 $c
              echo "-----------------------"
            done
          fi

          DEPLOY_EOF

          chmod +x deploy.sh
          tar -czf deploy.tar.gz docker-compose.aws.yaml nginx/ deploy.sh

      - name: Subir artefactos a S3
        run: |
          aws s3 cp deploy.tar.gz s3://${{ env.S3_DEPLOY_BUCKET }}/deploy.tar.gz

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-pack
    environment: qas

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hiluca-lbu-qas-vm" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: Instancia EC2 no encontrada."
            exit 1
          fi

          echo "Ejecutando despliegue en instancia $INSTANCE_ID..."

          COMMAND="
            set -e
            cd /tmp
            aws s3 cp s3://${{ env.S3_DEPLOY_BUCKET }}/deploy.tar.gz .
            mkdir -p /app/hiluca-lbu/nginx
            tar -xzf deploy.tar.gz -C /app/hiluca-lbu
            chown -R ubuntu:ubuntu /app/hiluca-lbu
            sudo -u ubuntu bash /app/hiluca-lbu/deploy.sh
          "

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$COMMAND]" \
            --comment "Deploy from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CMD_ID"
          echo "Esperando resultado (max 15 min)..."

          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Intento $i/90 - Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Despliegue exitoso"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Despliegue fallido. Logs de error:"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "Timeout esperando respuesta del SSM command"
          exit 1

