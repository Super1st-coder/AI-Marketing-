user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  client_max_body_size 500m;
  client_body_timeout 240s;
  send_timeout        240s;
  client_body_buffer_size 256k;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_vary on;
  gzip_proxied any;

  # Common proxy headers
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # ----- Upstreams -----

  # Frontends
  upstream fe_dev_backend   { server host.docker.internal:8080; }
  upstream fe_qa_backend    { server host.docker.internal:8082; }

  # Sinergia API
  upstream api_dev_backend  { server host.docker.internal:60002; }
  upstream api_qa_backend   { server host.docker.internal:60004; }

  # Fury AI backend (DEV only)
  upstream fury_dev_backend { server host.docker.internal:61000; }

  # n8n - Workflow Automation
  upstream n8n_dev_backend  { server host.docker.internal:25678; }
  upstream n8n_qa_backend   { server host.docker.internal:25680; }

  # Strapi - CMS
  upstream strapi_dev_backend { server host.docker.internal:21337; }
  upstream strapi_qa_backend  { server host.docker.internal:21339; }

  # Langfuse - AI Observability (web UI)
  upstream langfuse_dev_backend { server host.docker.internal:3000; }

  # MinIO - Object Storage (console UI)
  upstream minio_dev_backend { server host.docker.internal:9090; }

  # Qdrant - Vector DB (REST + dashboard)
  upstream qdrant_dev_backend { server host.docker.internal:6333; }

  # ----- HTTP → HTTPS redirect -----
  server {
    listen 80;
    listen [::]:80;
    server_name
      dev.hiluca.com
      qa.hiluca.com
      api-dev.hiluca.com
      api-qa.hiluca.com
      fury-dev.hiluca.com
      n8n-dev.hiluca.com
      n8n-qa.hiluca.com
      strapi-dev.hiluca.com
      strapi-qa.hiluca.com
      langfuse-dev.hiluca.com
      minio-dev.hiluca.com
      qdrant-dev.hiluca.com;
    return 301 https://$host$request_uri;
  }

  # ================== FRONTEND DEV (SPA) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 = /index.html;

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|ttf|otf|woff|woff2)$ {
      proxy_pass http://fe_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      proxy_pass http://fe_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_intercept_errors on;
    }

    location = /index.html {
      proxy_pass http://fe_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      add_header Cache-Control "no-store" always;
    }
  }

  # ================== FRONTEND QA (SPA) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qa.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 = /index.html;

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|ttf|otf|woff|woff2)$ {
      proxy_pass http://fe_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      proxy_pass http://fe_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_intercept_errors on;
    }

    location = /index.html {
      proxy_pass http://fe_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      add_header Cache-Control "no-store" always;
    }
  }

  # ================== API DEV (Sinergia) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://api_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ================== API QA (Sinergia) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-qa.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_request_buffering off;

    location / {
      proxy_pass http://api_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ================== FURY DEV (AI backend) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fury-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable buffering for SSE / streaming responses (AI completions)
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
      proxy_pass http://fury_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ================== N8N DEV (Workflow Automation) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://n8n_dev_backend;
      proxy_http_version 1.1;
      # n8n requires WebSocket support
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }

  # ================== N8N QA (Workflow Automation) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n-qa.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://n8n_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }

  # ================== STRAPI DEV (CMS) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name strapi-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://strapi_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ================== STRAPI QA (CMS) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name strapi-qa.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://strapi_qa_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ================== LANGFUSE DEV (AI Observability) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name langfuse-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://langfuse_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }

  # ================== MINIO DEV (Object Storage Console) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MinIO console requires larger body for object uploads
    client_max_body_size 5g;

    location / {
      proxy_pass http://minio_dev_backend;
      proxy_http_version 1.1;
      # MinIO console uses WebSocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }

  # ================== QDRANT DEV (Vector DB Dashboard) ==================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qdrant-dev.hiluca.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://qdrant_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
