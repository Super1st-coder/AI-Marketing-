    get:
      operationId: appsflyer-get-root
      responses: 
        "200": 
          description: "OK"
      x-google-backend:
        address: https://us-central1-careful-acumen-422922-k4.cloudfunctions.net/appflyer-webhook
        jwt_audience: https://us-central1-careful-acumen-422922-k4.cloudfunctions.net/appflyer-webhook
    post:
      operationId: appsflyer-post-root
      parameters:
        - in: body
          name: body
          schema: 
            type: object
            additionalProperties: true
      consumes: 
        - application/json
        - application/x-www-form-urlencoded
      responses: 
        "200": 
          description: "OK"
      x-google-backend:
        address: https://us-central1-careful-acumen-422922-k4.cloudfunctions.net/appflyer-webhook
        jwt_audience: https://us-central1-careful-acumen-422922-k4.cloudfunctions.net/appflyer-webhook