name: Deploy Frontend to AWS

on:
  push:
    branches:
      - aws-develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: lbr-frontend-image
  S3_BUCKET: hiluca-lbu-dev-deploy-861276093436 # Asegúrate que coincida con tu bucket
  IMAGE_TAG: develop

permissions:
  contents: read
  id-token: write

jobs:
  build-and-pack:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861276093436:role/hiluca-lbu-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configurar variables de entorno para DEV
        run: |
          cp .env_base .env
          # Forzamos HTTP explícitamente para dev ya que no usamos HTTPS en el ALB local
          sed -i "s|VITE_API_BASE_URL=.*|VITE_API_BASE_URL=https://api-dev.hiluca.com/api|g" .env
          sed -i "s|GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}|g" .env
          sed -i "s|GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|g" .env
          sed -i "s|VITE_GOOGLE_MAPS_API_KEY=.*|VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}|g" .env
          sed -i "s|VITE_GOOGLE_CLIENT_ID=.*|VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}|g" .env
          sed -i "s|VITE_POSTHOG_KEY=.*|VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}|g" .env
          sed -i "s|VITE_ENABLE_HUBSPOT=.*|VITE_ENABLE_HUBSPOT=${{ secrets.VITE_ENABLE_HUBSPOT }}|g" .env
          sed -i "s|VITE_HUBSPOT_PORTAL_ID=.*|VITE_HUBSPOT_PORTAL_ID=${{ secrets.VITE_HUBSPOT_PORTAL_ID }}|g" .env
          sed -i "s|VITE_ENABLE_LUCA_GUIDE=.*|VITE_ENABLE_LUCA_GUIDE=${{ secrets.VITE_ENABLE_LUCA_GUIDE }}|g" .env
          # Video flow on by default on this environment (not on production)
          sed -i "s|VITE_ENABLE_VIDEO_GENERATION=.*|VITE_ENABLE_VIDEO_GENERATION=true|g" .env
          sed -i "s|VITE_LUCA_GUIDE_API_BASE_URL=.*|VITE_LUCA_GUIDE_API_BASE_URL=${{ secrets.VITE_LUCA_GUIDE_API_BASE_URL }}|g" .env
          sed -i "s|VITE_ENABLE_BUDGET_STRATEGY=.*|VITE_ENABLE_BUDGET_STRATEGY=${{ secrets.VITE_ENABLE_BUDGET_STRATEGY }}|g" .env
          echo "Archivo .env configurado para DEV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Prepare deployment artifacts
        run: |
          cat << 'EOF' > deploy.sh
          # Cambiar al directorio correcto de la app
          cd /app/hiluca-frontend

          # Autenticar Docker con ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Actualizar el docker-compose para usar la imagen de ECR en vez de la de GCP
          sed -i "s|image: hiluca-frontend-image|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" docker-compose.yml
          
          # Descargar nueva imagen y levantar
          docker compose pull
          docker compose up -d --remove-orphans
          
          # Limpiar imágenes antiguas para ahorrar disco
          # docker system prune -af
          EOF
          tar -czf deploy-frontend.tar.gz docker-compose.yml deploy.sh

      - name: Upload artifacts to S3
        run: |
          aws s3 cp deploy-frontend.tar.gz s3://${{ env.S3_BUCKET }}/deploy-frontend.tar.gz

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-pack
    environment: develop

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861276093436:role/hiluca-lbu-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM SendCommand
        run: |
          # Obtenemos el ID de la instancia basándonos en el tag Name
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hiluca-lbu-dev-vm" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "No se encontró ninguna instancia EC2 en ejecución con el tag Name=hiluca-lbu-dev-vm"
            exit 1
          fi

          echo "Ejecutando despliegue en instancia $INSTANCE_ID..."

          COMMAND="
            set -e
            cd /tmp
            aws s3 cp s3://${{ env.S3_BUCKET }}/deploy-frontend.tar.gz .
            mkdir -p /app/hiluca-frontend
            tar -xzf deploy-frontend.tar.gz -C /app/hiluca-frontend
            chown -R ubuntu:ubuntu /app/hiluca-frontend
            sudo -u ubuntu bash /app/hiluca-frontend/deploy.sh
          "

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$COMMAND]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CMD_ID"
          echo "Esperando resultado (max 15 min)..."

          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Intento $i/90 - Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Despliegue exitoso"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Despliegue fallido. Error:"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "Timeout esperando SSM"
          exit 1
