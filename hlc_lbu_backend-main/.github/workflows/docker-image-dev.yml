name: Docker Develop Backend DEV

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-pack:
    name: Build & Pack Image
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      sinergia_changed: ${{ steps.check_sinergia.outputs.changed }}
      fury_changed: ${{ steps.check_fury.outputs.changed }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      # ── Hash de contenido: Sinergia ──────────────────────────────────────
      - name: Calcular hash de Sinergia
        id: hash_sinergia
        run: |
          HASH=$(find ./sinergia -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Restaurar cache hash Sinergia
        id: cache_sinergia
        uses: actions/cache@v5
        with:
          path: .cache/sinergia_hash
          key: sinergia-hash-${{ steps.hash_sinergia.outputs.hash }}

      - name: Verificar cambio Sinergia
        id: check_sinergia
        run: |
          if [ "${{ steps.cache_sinergia.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Sinergia sin cambios — se omite el build."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Sinergia cambió — se construirá la imagen."
          fi

      # ── Hash de contenido: Fury ──────────────────────────────────────────
      - name: Calcular hash de Fury
        id: hash_fury
        run: |
          HASH=$(find ./fury/app -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Restaurar cache hash Fury
        id: cache_fury
        uses: actions/cache@v5
        with:
          path: .cache/fury_hash
          key: fury-hash-${{ steps.hash_fury.outputs.hash }}

      - name: Verificar cambio Fury
        id: check_fury
        run: |
          if [ "${{ steps.cache_fury.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Fury sin cambios — se omite el build."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔨 Fury cambió — se construirá la imagen."
          fi

      # ── Autenticación GCP (solo si hay algo que construir) ───────────────
      - id: auth
        name: Authenticate to GCP
        if: steps.check_sinergia.outputs.changed == 'true' || steps.check_fury.outputs.changed == 'true'
        uses: google-github-actions/auth@v3
        with:
          service_account: githubactions@careful-acumen-422922-k4.iam.gserviceaccount.com
          workload_identity_provider: projects/401654669410/locations/global/workloadIdentityPools/github-pool/providers/hi-luca-repo

      - name: Configure Docker for GCR
        if: steps.check_sinergia.outputs.changed == 'true' || steps.check_fury.outputs.changed == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Obtener último release
        id: obtener_release
        if: steps.check_sinergia.outputs.changed == 'true' || steps.check_fury.outputs.changed == 'true'
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.TOKEN_USER_GITHUB }}" \
            "https://api.github.com/repos/${{ secrets.REPO_OWNER }}/${{ secrets.REPO_NAME }}/releases/latest" \
            | jq -r '.tag_name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      # ── Build Sinergia ────────────────────────────────────────────────────
      - name: Build & push Sinergia Docker image
        if: steps.check_sinergia.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./sinergia
          push: true
          tags: us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:develop

      - name: Guardar hash Sinergia en cache
        if: steps.check_sinergia.outputs.changed == 'true'
        run: |
          mkdir -p .cache
          echo "${{ steps.hash_sinergia.outputs.hash }}" > .cache/sinergia_hash

      # ── Build Fury ────────────────────────────────────────────────────────
      - name: Build & push Fury Docker image
        if: steps.check_fury.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./fury/app
          push: true
          tags: us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/fury-backend-image:develop

      - name: Guardar hash Fury en cache
        if: steps.check_fury.outputs.changed == 'true'
        run: |
          mkdir -p .cache
          echo "${{ steps.hash_fury.outputs.hash }}" > .cache/fury_hash

  deploy:
    name: Download & Deploy
    runs-on: ubuntu-latest
    needs: build-and-pack
    environment: develop
    # Solo despliega si al menos una imagen fue reconstruida
    if: needs.build-and-pack.outputs.sinergia_changed == 'true' || needs.build-and-pack.outputs.fury_changed == 'true'

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - id: auth-deploy
        name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          service_account: githubactions@careful-acumen-422922-k4.iam.gserviceaccount.com
          workload_identity_provider: projects/401654669410/locations/global/workloadIdentityPools/github-pool/providers/hi-luca-repo

      - name: Configure Docker for GCR 
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Pull Docker images
        run: |
          IMAGES=""
          if [ "${{ needs.build-and-pack.outputs.sinergia_changed }}" = "true" ]; then
            docker pull us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:develop
            IMAGES="$IMAGES us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/lbr-backend-image:develop"
          fi
          if [ "${{ needs.build-and-pack.outputs.fury_changed }}" = "true" ]; then
            docker pull us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/fury-backend-image:develop
            IMAGES="$IMAGES us-central1-docker.pkg.dev/careful-acumen-422922-k4/hiluca-docker-repository/fury-backend-image:develop"
          fi
          echo "IMAGES_TO_SAVE=$IMAGES" >> $GITHUB_ENV

      - name: Save images to tar
        run: docker save -o backend.tar ${{ env.IMAGES_TO_SAVE }}

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar tar al servidor
        run: scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa backend.tar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/mnt/disks/hiluca-data/temp/

      - name: Desplegar en servidor
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ramon/docker-deploy-dev
            docker load -i /mnt/disks/hiluca-data/temp/backend.tar
            docker compose up -d
            docker system prune -af
            rm -f /mnt/disks/hiluca-data/temp/backend.tar
            echo "Despliegue realizado exitosamente."

      - name: Finalizar
        run: echo "Despliegue completado."
