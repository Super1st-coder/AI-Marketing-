name: AWS Deploy Webhook Router DEV

on:
  push:
    branches:
      - aws-develop
    paths:
      - 'webhooks/router/**'
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

env:
  AWS_REGION: "us-east-2"
  ROLE_TO_ASSUME: "arn:aws:iam::861276093436:role/hiluca-lbu-dev-github-actions-role"
  FUNCTION_NAME: "hiluca-lbu-dev-webhook-router"

jobs:
  deploy-lambda:
    name: Package and Deploy to AWS Lambda
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies and package
        run: |
          cd webhooks/router
          pip install -r requirements-aws.txt -t .
          zip -r function.zip . -i "*.py" "registry.py" "verifiers.py" "lambda_function.py" "boto3/*" "botocore/*" "jmespath/*" "s3transfer/*" "urllib3/*"
          
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          cd webhooks/router
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ${{ env.AWS_REGION }}
