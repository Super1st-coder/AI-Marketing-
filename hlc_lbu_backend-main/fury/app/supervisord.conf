[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
minfds=10240

[program:uvicorn]
command=bash -c "sleep 5 && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 5 --timeout-worker-healthcheck 30"
priority=99 # Prioridad alta = Arranca DESPUÉS
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app"

[program:celery]
command=celery -A services.celery_app worker -P prefork --optimization=fair --loglevel INFO -n worker@%%h --uid 0
process_name=%(program_name)s
numprocs=1  # Número de workers que quieres ejecutar
priority=10 # Prioridad baja = Arranca PRIMERO
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app",CELERYD_CONCURRENCY="auto"
